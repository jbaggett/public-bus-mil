[project]
name = "public-bus-mil"
version = "0.3.0"
description = "Reproducible exam-level MIL benchmark from public BUS video datasets (MICCAI-BUV + WHBUS) with 5-fold patient-grouped splits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "pillow>=9.0",
    "scipy>=1.10",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
build-bus-mil-bags = "build_bags:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["public_bus_mil*"]
